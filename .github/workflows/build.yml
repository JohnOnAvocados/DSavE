name: Build

on:
  push:
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host-side engine tests
        run: make -C tests

  nds:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DSavE.nds
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: DSavE
          path: DSavE.nds
